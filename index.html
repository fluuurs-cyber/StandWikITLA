<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Move Codex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Spectral:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08080b;
  --panel:#0e0e13;
  --panel2:#13131a;
  --line:#2a2417;
  --line2:#3a321f;
  --gold:#d9a441;
  --gold-soft:#e8c27a;
  --text:#d9ccaa;
  --muted:#8b8470;
  --green:#2fd69a;
  --aura:#8144e4;
  --nav-h:54px;
  --serif:"Cormorant Garamond","Palatino Linotype",Georgia,serif;
  --body:"Spectral",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nav-h) + 70px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:17px;line-height:1.65;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ---------- nav ---------- */
.nav{position:fixed;inset:0 0 auto 0;height:var(--nav-h);z-index:50;display:flex;align-items:center;gap:28px;padding:0 28px;background:rgba(8,8,11,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.logo{font-family:var(--serif);font-size:26px;color:var(--gold);letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.logo i{display:block;width:18px;height:18px;background:var(--gold);clip-path:polygon(50% 0,100% 40%,50% 100%,0 40%)}
.nav .links{display:flex;gap:26px;font-family:var(--serif);font-size:18px;font-weight:500}
.nav .links a{color:var(--muted)}
.nav .links a.on,.nav .links a:hover{color:#fff}
.nav .spacer{flex:1}
.search{width:min(300px,34vw);background:var(--panel);border:1px solid var(--line2);border-radius:999px;padding:7px 16px;color:var(--text);font:14px var(--mono)}
.search::placeholder{color:var(--muted)}
.lockbtn{border:1px solid var(--gold);background:transparent;color:var(--gold);padding:8px 18px;font-family:var(--serif);font-weight:600;font-size:17px;letter-spacing:.04em}
.lockbtn:hover{background:var(--gold);color:#17110a}
body.editing .lockbtn{background:var(--gold);color:#17110a}

/* ---------- layout ---------- */
main{max-width:1240px;margin:0 auto;padding:calc(var(--nav-h) + 34px) 28px 140px}
.crumbs{font:13px var(--mono);color:var(--muted);margin-bottom:6px}
.crumbs a:hover{color:var(--gold)}
.crumbs span{margin:0 6px}
h1.title{font-family:var(--serif);font-weight:600;font-size:clamp(38px,5vw,60px);line-height:1.05;margin:0 0 26px;color:#f1e6c8}
h2{font-family:var(--serif);font-weight:600;color:var(--gold);margin:0}

/* ---------- editable fields ---------- */
.dash{color:var(--muted)}
body.editing input[type=text],body.editing textarea,body.editing select{
  width:100%;background:rgba(217,164,65,.06);border:1px dashed var(--line2);border-radius:2px;color:inherit;font:inherit;padding:2px 8px;margin:0;resize:none}
body.editing textarea{display:block;overflow:hidden;line-height:1.55}
body.editing input[type=text]:focus,body.editing textarea:focus,body.editing select:focus{border-color:var(--gold);background:rgba(217,164,65,.1);outline:none}
body.editing select{font-family:var(--mono);font-size:13px;padding:5px 8px;width:auto;background:var(--panel2);color:var(--text)}
input[type=color]{width:22px;height:22px;padding:0;border:0;background:none;cursor:pointer;vertical-align:middle}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 368px;gap:24px;align-items:start}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);background:var(--panel)}
.stat{padding:16px 18px 18px;border-right:1px solid var(--line);min-width:0}
.stat:last-child{border-right:0}
.lbl{display:block;font:11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.stat .val{font-family:var(--serif);font-weight:600;font-size:20px;line-height:1.25;color:var(--gold-soft);overflow-wrap:anywhere}
.stat.ok .val{color:var(--green);font-family:var(--body);font-weight:400;font-size:17px}
body.editing .stat .val input,body.editing .stat .val textarea{font-family:inherit;font-size:inherit;font-weight:inherit}

.quote{margin:24px 0;padding:26px 28px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--aura)}
.quote p{margin:0 0 14px;font-family:var(--serif);font-style:italic;font-size:clamp(24px,2.6vw,32px);line-height:1.25;color:#f1e6c8}
.quote cite{display:block;font:12px var(--mono);letter-spacing:.1em;color:#6fa3a8;font-style:normal;text-transform:uppercase}
body.editing .quote p textarea{font-style:italic}

.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px}
.chip{display:flex;align-items:center;gap:10px;border:1px solid var(--line2);background:var(--panel);padding:8px 14px;font:12px var(--mono);letter-spacing:.06em;color:var(--gold-soft)}
.chip .k{color:var(--muted)}
.chip .dot{width:13px;height:13px;border-radius:50%;background:var(--aura)}
.chip input[type=text]{min-width:150px}

.overview{border:1px solid var(--line);background:linear-gradient(180deg,#101016,#0b0b10);padding:26px 28px}
.overview header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:16px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.overview h2{font-size:32px}
.overview .tag{font:11px var(--mono);letter-spacing:.1em;color:var(--gold-soft);border:1px solid var(--line2);padding:6px 10px}
.overview p{margin:0;color:var(--text)}

.portrait{position:sticky;top:calc(var(--nav-h) + 20px);border:1px solid var(--line);background:var(--panel);border-bottom:3px solid var(--aura)}
.portrait .top{display:flex;justify-content:space-between;padding:12px}
.badge{font:11px var(--mono);letter-spacing:.1em;padding:4px 10px;background:var(--gold);color:#17110a;max-width:60%}
.badge.out{background:transparent;border:1px solid var(--line2);color:var(--gold-soft)}
.portrait .frame{position:relative;aspect-ratio:3/4;margin:0 12px 14px;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--aura) 22%,transparent),transparent 70%),#0a0a0e;background-image:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--aura) 22%,transparent),transparent 70%),radial-gradient(#1c1a14 1px,transparent 1px);background-size:auto,14px 14px;display:grid;place-items:center;overflow:hidden}
.portrait img{width:100%;height:100%;object-fit:contain;display:block}
.frame .none{color:var(--muted);font:13px var(--mono);text-align:center;padding:20px}
.frame .tools{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}

/* ---------- buttons / drop zones ---------- */
.btn{border:1px solid var(--line2);background:var(--panel2);padding:7px 14px;font:13px var(--mono);color:var(--text)}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#17110a}
.btn.gold:hover{background:var(--gold-soft);color:#17110a}
.btn.danger:hover{border-color:#e0605c;color:#e0605c}
.btn.sm{padding:4px 9px;font-size:12px}
.edit-only{display:none}
body.editing .edit-only{display:inline-flex}
body.editing .edit-only.block{display:block}
.drop{border:1px dashed var(--line2);background:rgba(217,164,65,.04);color:var(--muted);font:13px var(--mono);padding:18px 12px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--gold);color:var(--gold);background:rgba(217,164,65,.1)}

/* ---------- mode bar ---------- */
.modebar{position:fixed;left:50%;top:calc(var(--nav-h) + 12px);transform:translate(-50%,-14px);z-index:40;display:flex;gap:6px;padding:6px;background:rgba(14,14,19,.96);border:1px solid var(--line2);box-shadow:0 12px 40px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.modebar.show{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.modebar button{border:1px solid transparent;background:transparent;padding:9px 22px;font-family:var(--serif);font-weight:600;font-size:19px;color:var(--muted);display:flex;gap:9px;align-items:baseline}
.modebar button small{font:11px var(--mono);color:var(--muted)}
.modebar button:hover{color:#fff}
.modebar button[aria-pressed=true]{background:var(--gold);color:#17110a}
.modebar button[aria-pressed=true] small{color:#4a3a14}

/* ---------- moves ---------- */
.moves-head{margin:76px 0 22px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.moves-head h2{font-size:38px}
.moves-head p{margin:0;color:var(--muted);font-size:15px;font-style:italic}
.move{border:1px solid var(--line);background:var(--panel);margin-bottom:18px}
.move>header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:16px 22px;border-bottom:1px solid var(--line);background:var(--panel2)}
.move h3{margin:0;flex:1;min-width:180px;font-family:var(--serif);font-weight:600;font-size:28px;line-height:1.15;color:#f1e6c8}
.move .tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pill{font:11px var(--mono);letter-spacing:.08em;border:1px solid var(--line2);padding:3px 9px;color:var(--gold-soft);white-space:nowrap}
.pill.uni{color:var(--muted)}
.move-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,40%);gap:0}
.move-body.solo{grid-template-columns:1fr}
.fields{padding:20px 22px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 20px;align-content:start}
.field.wide{grid-column:1/-1}
.field .v{font-size:16px;overflow-wrap:anywhere}
.field.wide .v{font-size:17px}
.media{padding:20px 22px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.thumb{margin:0;position:relative;border:1px solid var(--line2);background:#0a0a0e;aspect-ratio:16/10;display:grid;place-items:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.thumb .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border:0;background:rgba(8,8,11,.85);color:#fff;line-height:1;font-size:16px}
.thumb .x:hover{background:#c0443f}
.empty{border:1px dashed var(--line2);padding:46px 20px;text-align:center;color:var(--muted);font-style:italic}

/* ---------- home ---------- */
.home-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:14px;margin-bottom:26px}
.home-head h1{margin:0;font-family:var(--serif);font-size:clamp(40px,6vw,68px);font-weight:600;line-height:1;color:#f1e6c8}
.home-head p{margin:8px 0 0;color:var(--muted);max-width:52ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.pcard{position:relative;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;transition:border-color .15s,transform .15s}
.pcard:hover{border-color:var(--gold);transform:translateY(-2px)}
.pcard .img{aspect-ratio:4/3;background:#0a0a0e;display:grid;place-items:center;border-bottom:3px solid var(--c,var(--aura));overflow:hidden}
.pcard img{width:100%;height:100%;object-fit:cover;object-position:top}
.pcard .img span{font-family:var(--serif);font-size:56px;color:var(--line2)}
.pcard .meta{padding:14px 16px 16px}
.pcard h3{margin:0;font-family:var(--serif);font-size:26px;font-weight:600;color:#f1e6c8;line-height:1.1}
.pcard .meta p{margin:4px 0 0;font:12px var(--mono);color:var(--muted)}
.pcard .del{position:absolute;top:8px;right:8px}

/* ---------- floating edit panel / overlays ---------- */
.editbar{position:fixed;right:18px;bottom:18px;z-index:60;display:none;gap:8px;align-items:center;flex-wrap:wrap;max-width:calc(100vw - 36px);padding:10px 12px;background:rgba(14,14,19,.97);border:1px solid var(--gold);box-shadow:0 10px 40px rgba(0,0,0,.7)}
body.editing .editbar{display:flex}
.editbar .state{font:12px var(--mono);color:var(--green);margin-right:4px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);z-index:90;background:var(--gold);color:#17110a;padding:10px 18px;font:13px var(--mono);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%)}
.lightbox{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.92);display:none;place-items:center;padding:30px;cursor:zoom-out}
.lightbox.show{display:grid}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--gold);padding:26px 28px;width:min(420px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.75)}
dialog h3{margin:0 0 6px;font-family:var(--serif);font-size:28px;color:var(--gold)}
dialog p{margin:0 0 14px;color:var(--muted);font-size:15px}
dialog input{width:100%;background:var(--bg);border:1px solid var(--line2);color:var(--text);padding:10px 12px;font:15px var(--mono);margin-bottom:6px}
dialog .err{color:#e0605c;font:13px var(--mono);min-height:20px}
dialog .row{display:flex;justify-content:flex-end;gap:10px;margin-top:10px}

@media (max-width:980px){
  .hero{grid-template-columns:1fr}
  .portrait{position:static;order:-1;max-width:420px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat:nth-child(2){border-right:0}
  .stat:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .move-body{grid-template-columns:1fr}
  .media{border-left:0;border-top:1px solid var(--line)}
  .fields{grid-template-columns:1fr 1fr}
}
@media (max-width:640px){
  .nav{padding:0 14px;gap:12px}.nav .links{display:none}.search{width:auto;flex:1}
  main{padding-left:14px;padding-right:14px}
  .fields{grid-template-columns:1fr}
  .modebar{width:calc(100vw - 20px)}.modebar button{flex:1;justify-content:center;padding:9px 6px;font-size:16px}.modebar button small{display:none}
}
</style>
</head>
<body>

<nav class="nav">
  <a class="logo" href="#/"><i></i>Move Codex</a>
  <div class="links"><a href="#/" id="navPages" class="on">Pages</a></div>
  <div class="spacer"></div>
  <input class="search" id="search" type="search" placeholder="Search pages  (Ctrl/⌘ K)" aria-label="Search pages">
  <button class="lockbtn" id="lockBtn">Edit</button>
</nav>

<div class="modebar" id="modebar" role="tablist" aria-label="Move list mode"></div>

<main id="app"></main>

<div class="editbar" id="editbar">
  <span class="state" id="saveState">Draft saved</span>
  <button class="btn gold" data-act="export">Export data.json</button>
  <button class="btn" data-act="import">Import</button>
  <button class="btn danger" data-act="discard">Discard draft</button>
  <button class="btn" data-act="lock">Lock</button>
</div>

<div class="toast" id="toast"></div>
<div class="lightbox" id="lightbox"><img alt=""></div>

<dialog id="authDlg">
  <form id="authForm" autocomplete="off">
    <h3 id="authTitle">Unlock editing</h3>
    <p id="authText">Enter your passphrase.</p>
    <input type="password" id="authPw" placeholder="Passphrase" aria-label="Passphrase">
    <div class="err" id="authErr"></div>
    <div class="row">
      <button type="button" class="btn" id="authCancel">Cancel</button>
      <button type="submit" class="btn gold" id="authOk">Unlock</button>
    </div>
  </form>
</dialog>

<input type="file" id="filePick" accept="image/*" multiple hidden>
<input type="file" id="jsonPick" accept="application/json,.json" hidden>

<script>
/* =====================================================================
   Move Codex — static site for GitHub Pages
   - Everyone sees what is in data.json (the published copy)
   - The creator unlocks edit mode with a passphrase, edits happen in a
     local draft, then "Export data.json" and commit it to the repo
   ===================================================================== */

const MODES = [
  { key:'universal', label:'Universal', note:'Moves every form can use.' },
  { key:'off',       label:'Stand Off', note:'Everything in Universal, plus moves that only exist with the Stand off.' },
  { key:'on',        label:'Stand On',  note:'Everything in Universal, plus moves that only exist with the Stand on.' }
];
const modeLabel = k => (MODES.find(m => m.key === k) || MODES[0]).label;

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);

/* ---------- data ---------- */
const blankPage = (name = 'New Character') => ({
  id: uid(), name,
  rarity: 'High Tier', part: 'Part 1', type: 'Class - Role', status: 'Confirmed',
  quote: 'Your signature line goes here', quoteLabel: 'Signature line',
  aura: '#8144e4', arc: 'Featured arc', playable: 'Confirmed playable',
  overview: 'Write the character overview here.',
  portrait: '', moves: []
});
const blankMove = (mode = 'universal') => ({
  id: uid(), mode, name: 'New Move', does: '', meter: '', block: '', armor: '', images: []
});
const seed = () => {
  const p = blankPage('Example Character');
  p.overview = 'This is a sample page. Unlock edit mode, then change any text, drop in a portrait, and add moves to each mode.';
  p.moves = [
    { id: uid(), mode:'universal', name:'Light Combo', does:'Four-hit string that ends in a knockdown.', meter:'0', block:'Blockable', armor:'None', images:[] },
    { id: uid(), mode:'universal', name:'Grab', does:'Close range throw. Cannot be blocked.', meter:'0', block:'Unblockable', armor:'None', images:[] },
    { id: uid(), mode:'off',       name:'Off-Mode Barrage', does:'Rapid flurry that pushes the opponent back.', meter:'25%', block:'Blockable, chip damage', armor:'Light armor on startup', images:[] },
    { id: uid(), mode:'on',        name:'On-Mode Heavy Strike', does:'Slow, powerful hit with a long wind-up.', meter:'50%', block:'Guard break', armor:'Super armor', images:[] }
  ];
  return { editHash: '', pages: [p] };
};

let state = null;
let editing = false;
let tab = 'universal';

/* ---------- local draft storage (IndexedDB, so big images fit) ---------- */
const idb = {
  db: null,
  open() {
    return this.db || (this.db = new Promise((res, rej) => {
      const r = indexedDB.open('move-codex', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    }));
  },
  async get(k) { const db = await this.open(); return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  async set(k, v) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); },
  async del(k) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').delete(k); t.oncomplete = res; t.onerror = () => rej(t.error); }); }
};

let saveTimer;
function save() {
  if (!editing) return;
  $('#saveState').textContent = 'Saving…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 350);
}
async function saveNow() {
  try { await idb.set('draft', state); $('#saveState').textContent = 'Draft saved'; }
  catch (e) { $('#saveState').textContent = 'Could not save draft'; }
}

/* ---------- passphrase gate ---------- */
async function sha(s) {
  const text = 'codex:' + s;
  if (window.crypto && crypto.subtle) {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
  }
  let h = 5381; for (const c of text) h = ((h << 5) + h + c.charCodeAt(0)) | 0; return 'x' + h;
}
function openAuth() {
  const first = !state.editHash;
  $('#authTitle').textContent = first ? 'Set your edit passphrase' : 'Unlock editing';
  $('#authText').textContent = first
    ? 'Choose a passphrase (6+ characters). Export data.json afterwards so it is saved with your site.'
    : 'Enter your passphrase to edit pages.';
  $('#authOk').textContent = first ? 'Set passphrase' : 'Unlock';
  $('#authPw').value = ''; $('#authErr').textContent = '';
  $('#authDlg').showModal();
  $('#authPw').focus();
}
$('#authCancel').onclick = () => $('#authDlg').close();
$('#authForm').onsubmit = async e => {
  e.preventDefault();
  const pw = $('#authPw').value;
  if (!pw) return;
  const h = await sha(pw);
  if (!state.editHash) {
    if (pw.length < 6) { $('#authErr').textContent = 'Use at least 6 characters.'; return; }
    state.editHash = h; await saveNow();
  } else if (state.editHash !== h) {
    $('#authErr').textContent = 'Wrong passphrase.'; return;
  }
  sessionStorage.setItem('codex-unlocked', '1');
  editing = true;
  $('#authDlg').close();
  render();
  toast('Edit mode on');
};
function lock() {
  sessionStorage.removeItem('codex-unlocked');
  editing = false;
  render();
}
$('#lockBtn').onclick = () => editing ? lock() : openAuth();

/* ---------- routing ---------- */
const curPage = () => {
  const m = location.hash.match(/^#\/p\/(.+)$/);
  return m ? state.pages.find(p => p.id === m[1]) : null;
};
window.addEventListener('hashchange', () => { tab = 'universal'; render(); window.scrollTo(0, 0); });

/* ---------- field helper ---------- */
function F(obj, field, ph, opt = {}) {
  const v = obj[field] ?? '';
  if (!editing) return v ? esc(v).replace(/\n/g, '<br>') : '<span class="dash">—</span>';
  const mid = opt.mid ? ` data-m="${opt.mid}"` : '';
  const d = `data-f="${field}"${mid} placeholder="${esc(ph)}" aria-label="${esc(ph)}"`;
  return opt.ml ? `<textarea ${d} rows="2">${esc(v)}</textarea>` : `<input type="text" ${d} value="${esc(v)}">`;
}

/* ---------- views ---------- */
function homeView() {
  const q = $('#search').value.trim().toLowerCase();
  const pages = state.pages.filter(p => !q || (p.name + ' ' + p.part + ' ' + p.rarity).toLowerCase().includes(q));
  const cards = pages.map(p => `
    <a class="pcard" href="#/p/${p.id}" style="--c:${esc(p.aura)}">
      <div class="img">${p.portrait ? `<img src="${p.portrait}" alt="">` : `<span>${esc((p.name || '?')[0])}</span>`}</div>
      <div class="meta"><h3>${esc(p.name)}</h3><p>${esc(p.part)} · ${esc(p.rarity)}</p></div>
      <button class="btn sm danger edit-only del" data-act="del-page" data-id="${p.id}">Delete</button>
    </a>`).join('');
  return `
    <div class="home-head">
      <div>
        <h1>Pages</h1>
        <p>Pick a character to see their full move list.</p>
      </div>
      <button class="btn gold edit-only" data-act="new-page">+ New page</button>
    </div>
    ${cards ? `<div class="grid">${cards}</div>` : `<div class="empty">${q ? 'No pages match that search.' : (editing ? 'No pages yet. Select “New page” to start one.' : 'No pages yet.')}</div>`}`;
}

function pageView(p) {
  const ok = /confirmed/i.test(p.status || '');
  const stat = (label, field, ph, cls = '') =>
    `<div class="stat ${cls}"><span class="lbl">${label}</span><div class="val">${F(p, field, ph, { ml: true })}</div></div>`;
  return `
    <div class="crumbs"><a href="#/">Pages</a><span>/</span>${esc(p.name)}</div>
    <h1 class="title">${F(p, 'name', 'Page name')}</h1>

    <section class="hero" id="hero">
      <div>
        <div class="stats">
          ${stat('Rarity', 'rarity', 'Rarity')}
          ${stat('Part', 'part', 'Part')}
          ${stat('Type', 'type', 'Type / class')}
          ${stat('Status', 'status', 'Status', ok ? 'ok' : '')}
        </div>

        <blockquote class="quote">
          <p>“${F(p, 'quote', 'Signature line', { ml: true })}”</p>
          <cite>${F(p, 'quoteLabel', 'Quote label')}</cite>
        </blockquote>

        <div class="chips">
          <div class="chip"><span class="dot" id="auraDot"></span><span class="k">Aura colour</span>
            ${editing ? `<input type="color" data-f="aura" value="${esc(p.aura)}" aria-label="Aura colour"><span id="auraHex">${esc(p.aura)}</span>` : `<span>${esc(p.aura)}</span>`}
          </div>
          <div class="chip"><span class="k">Arc</span>${F(p, 'arc', 'Featured arc')}</div>
          <div class="chip">${F(p, 'playable', 'Playable status')}</div>
        </div>

        <div class="card overview">
          <header><h2>Overview</h2><span class="tag">Codex entry</span></header>
          <p>${F(p, 'overview', 'Write the overview', { ml: true })}</p>
        </div>
      </div>

      <aside class="portrait">
        <div class="top"><span class="badge">${esc(p.status || '—')}</span><span class="badge out">${esc(p.part || '')}</span></div>
        <div class="frame">
          ${p.portrait ? `<img src="${p.portrait}" alt="${esc(p.name)} portrait">` : `<div class="none">${editing ? 'Add a portrait below' : 'No portrait yet'}</div>`}
        </div>
        <div class="edit-only block" style="padding:0 12px 12px">
          <div class="drop" data-drop="portrait" data-pick="portrait">Drop portrait here or click to choose</div>
          ${p.portrait ? `<button class="btn sm danger" style="margin-top:8px" data-act="del-portrait">Remove portrait</button>` : ''}
        </div>
      </aside>
    </section>

    <div id="sentinel"></div>
    <div class="moves-head"><h2>Move List</h2><p id="modeNote"></p></div>
    <section id="moves"></section>`;
}

function visibleMoves(p) {
  return p.moves.filter(m => m.mode === 'universal' || m.mode === tab);
}

function movesHTML(p) {
  const list = visibleMoves(p);
  const cards = list.map((m, i) => {
    const imgs = (m.images || []).map((src, n) => `
      <figure class="thumb"><img src="${src}" alt="${esc(m.name)} preview ${n + 1}" data-act="zoom">
        ${editing ? `<button class="x" data-act="del-img" data-m="${m.id}" data-i="${n}" aria-label="Remove image">×</button>` : ''}
      </figure>`).join('');
    const hasMedia = imgs || editing;
    const showTag = tab !== 'universal';
    return `
    <article class="move" data-id="${m.id}">
      <header>
        <h3>${F(m, 'name', 'Move name', { mid: m.id })}</h3>
        ${showTag ? `<span class="pill ${m.mode === 'universal' ? 'uni' : ''}">${m.mode === 'universal' ? 'Universal' : modeLabel(m.mode) + ' only'}</span>` : ''}
        <div class="tools edit-only">
          <select data-f="mode" data-m="${m.id}" aria-label="Which modes show this move">
            ${MODES.map(o => `<option value="${o.key}" ${o.key === m.mode ? 'selected' : ''}>${o.key === 'universal' ? 'All modes' : o.label + ' only'}</option>`).join('')}
          </select>
          <button class="btn sm" data-act="up" data-m="${m.id}" aria-label="Move up">↑</button>
          <button class="btn sm" data-act="down" data-m="${m.id}" aria-label="Move down">↓</button>
          <button class="btn sm danger" data-act="del-move" data-m="${m.id}">Delete</button>
        </div>
      </header>
      <div class="move-body ${hasMedia ? '' : 'solo'}">
        <div class="fields">
          <div class="field wide"><span class="lbl">What it does</span><div class="v">${F(m, 'does', 'Describe the move', { ml: true, mid: m.id })}</div></div>
          <div class="field"><span class="lbl">Meter cost</span><div class="v">${F(m, 'meter', 'e.g. 25%', { mid: m.id })}</div></div>
          <div class="field"><span class="lbl">Block properties</span><div class="v">${F(m, 'block', 'e.g. Blockable', { ml: true, mid: m.id })}</div></div>
          <div class="field"><span class="lbl">Armor properties</span><div class="v">${F(m, 'armor', 'e.g. Super armor', { ml: true, mid: m.id })}</div></div>
        </div>
        ${hasMedia ? `<div class="media">
          ${imgs ? `<div class="thumbs">${imgs}</div>` : ''}
          <div class="drop edit-only block" data-drop="${m.id}" data-pick="${m.id}">Drop images or GIFs here, or click to choose</div>
        </div>` : ''}
      </div>
    </article>`;
  }).join('');

  const add = `<button class="btn gold edit-only" data-act="add-move">+ Add move to ${modeLabel(tab)}</button>`;
  return (cards || `<div class="empty">No moves in ${modeLabel(tab)} yet.</div>`) + `<div style="margin-top:6px">${add}</div>`;
}

function renderModebar(p) {
  const bar = $('#modebar');
  if (!p) { bar.classList.remove('show'); bar.innerHTML = ''; return; }
  bar.innerHTML = MODES.map(m => {
    const n = p.moves.filter(x => x.mode === 'universal' || x.mode === m.key).length;
    return `<button role="tab" data-act="tab" data-tab="${m.key}" aria-pressed="${m.key === tab}">${m.label}<small>${n}</small></button>`;
  }).join('');
  updateModebarVisibility();
}
function renderMoves(p) {
  $('#moves').innerHTML = movesHTML(p);
  $('#modeNote').textContent = (MODES.find(m => m.key === tab) || {}).note || '';
  renderModebar(p);
  autosize();
}
function updateModebarVisibility() {
  const bar = $('#modebar'), s = $('#sentinel');
  if (!s) { bar.classList.remove('show'); return; }
  bar.classList.toggle('show', s.getBoundingClientRect().top < 40);
}
window.addEventListener('scroll', updateModebarVisibility, { passive: true });

function applyAura(color) {
  document.documentElement.style.setProperty('--aura', color || '#8144e4');
}
function autosize() {
  $$('textarea').forEach(t => { t.style.height = 'auto'; t.style.height = t.scrollHeight + 2 + 'px'; });
}

function render() {
  document.body.classList.toggle('editing', editing);
  $('#lockBtn').textContent = editing ? 'Lock' : 'Edit';
  const p = curPage();
  $('#navPages').classList.toggle('on', !p);
  if (p) {
    applyAura(p.aura);
    $('#app').innerHTML = pageView(p);
    $('#auraDot') && ($('#auraDot').style.background = p.aura);
    renderMoves(p);
  } else {
    applyAura('#8144e4');
    $('#app').innerHTML = homeView();
    renderModebar(null);
  }
  autosize();
}

/* ---------- editing: typing ---------- */
document.addEventListener('input', e => {
  const t = e.target;
  if (!editing || !t.dataset || !t.dataset.f) return;
  const p = curPage(); if (!p) return;
  const tgt = t.dataset.m ? p.moves.find(m => m.id === t.dataset.m) : p;
  if (!tgt) return;
  tgt[t.dataset.f] = t.value;
  if (t.tagName === 'TEXTAREA') { t.style.height = 'auto'; t.style.height = t.scrollHeight + 2 + 'px'; }
  if (t.dataset.f === 'aura') { applyAura(t.value); $('#auraDot').style.background = t.value; $('#auraHex').textContent = t.value; }
  if (t.dataset.f === 'mode') renderMoves(p);
  save();
});
// keep the status colour in sync when the user finishes typing
document.addEventListener('change', e => {
  const t = e.target;
  if (editing && t.dataset && (t.dataset.f === 'status' || t.dataset.f === 'part')) { const p = curPage(); if (p) { render(); } }
});

/* ---------- editing: clicks ---------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act],[data-pick]');
  if (!el) return;
  const act = el.dataset.act;
  const p = curPage();

  if (el.dataset.pick && !act) { pickTarget = el.dataset.pick; $('#filePick').click(); return; }

  switch (act) {
    case 'tab':
      tab = el.dataset.tab; renderMoves(p); break;

    case 'zoom':
      $('#lightbox img').src = el.src; $('#lightbox').classList.add('show'); break;

    case 'new-page': {
      if (!editing) return;
      const np = blankPage(); state.pages.push(np); save(); location.hash = '#/p/' + np.id; break;
    }
    case 'del-page':
      e.preventDefault(); e.stopPropagation();
      if (editing && confirm('Delete this page and all of its moves?')) { state.pages = state.pages.filter(x => x.id !== el.dataset.id); save(); render(); }
      break;

    case 'add-move': {
      const m = blankMove(tab); p.moves.push(m); save(); renderMoves(p);
      const card = $(`.move[data-id="${m.id}"]`); card && card.scrollIntoView({ block: 'center' });
      break;
    }
    case 'del-move':
      if (confirm('Delete this move?')) { p.moves = p.moves.filter(m => m.id !== el.dataset.m); save(); renderMoves(p); }
      break;
    case 'up': case 'down': {
      const vis = visibleMoves(p), i = vis.findIndex(m => m.id === el.dataset.m);
      const j = act === 'up' ? i - 1 : i + 1;
      if (j < 0 || j >= vis.length) break;
      const a = p.moves.indexOf(vis[i]), b = p.moves.indexOf(vis[j]);
      [p.moves[a], p.moves[b]] = [p.moves[b], p.moves[a]];
      save(); renderMoves(p);
      const card = $(`.move[data-id="${el.dataset.m}"]`); card && card.scrollIntoView({ block: 'center' });
      break;
    }
    case 'del-img': {
      const m = p.moves.find(x => x.id === el.dataset.m);
      m.images.splice(+el.dataset.i, 1); save(); renderMoves(p); break;
    }
    case 'del-portrait': p.portrait = ''; save(); render(); break;

    case 'export': exportJSON(); break;
    case 'import': $('#jsonPick').click(); break;
    case 'discard':
      if (confirm('Throw away your local edits and reload the published data.json?')) { await idb.del('draft'); location.reload(); }
      break;
    case 'lock': lock(); break;
  }
});
$('#lightbox').onclick = () => $('#lightbox').classList.remove('show');
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') $('#lightbox').classList.remove('show');
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#search').focus(); }
});
$('#search').addEventListener('input', () => { if (curPage()) location.hash = '#/'; else render(); });

/* ---------- images ---------- */
let pickTarget = null;
function toData(file, max) {
  return new Promise((res, rej) => {
    if (file.type === 'image/gif' && file.size < 4 * 1024 * 1024) { // keep animation
      const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); return;
    }
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/webp', 0.85));
    };
    img.onerror = rej; img.src = url;
  });
}
async function handleFiles(target, files) {
  if (!editing) return;
  const p = curPage(); if (!p) return;
  const imgs = [...files].filter(f => f.type.startsWith('image/'));
  if (!imgs.length) { toast('Only image files can be added'); return; }
  for (const f of imgs) {
    try {
      if (target === 'portrait') { p.portrait = await toData(f, 1100); }
      else { const m = p.moves.find(x => x.id === target); if (m) m.images.push(await toData(f, 900)); }
    } catch { toast('Could not read ' + f.name); }
  }
  save();
  target === 'portrait' ? render() : renderMoves(p);
}
$('#filePick').onchange = e => { handleFiles(pickTarget, e.target.files); e.target.value = ''; };

['dragover', 'drop'].forEach(ev => window.addEventListener(ev, e => e.preventDefault()));
document.addEventListener('dragover', e => { const d = e.target.closest('[data-drop]'); $$('.drop.over').forEach(x => x !== d && x.classList.remove('over')); d && d.classList.add('over'); });
document.addEventListener('dragleave', e => { const d = e.target.closest('[data-drop]'); d && d.classList.remove('over'); });
document.addEventListener('drop', e => {
  const d = e.target.closest('[data-drop]'); if (!d) return;
  d.classList.remove('over'); handleFiles(d.dataset.drop, e.dataTransfer.files);
});

/* ---------- export / import ---------- */
function exportJSON() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'data.json'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Saved data.json. Upload it to your repo to publish.');
}
$('#jsonPick').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!Array.isArray(d.pages)) throw 0;
    if (!confirm('Replace your current draft with this file?')) return;
    state = { editHash: d.editHash || state.editHash || '', pages: d.pages };
    await saveNow(); location.hash = '#/'; render(); toast('Imported');
  } catch { toast('That file is not a valid data.json'); }
};

/* ---------- toast ---------- */
let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
}

/* ---------- boot ---------- */
(async function init() {
  let draft = null;
  try { draft = await idb.get('draft'); } catch {}
  if (draft && draft.pages) state = draft;
  else {
    try { const r = await fetch('data.json', { cache: 'no-store' }); if (r.ok) state = await r.json(); } catch {}
    if (!state || !Array.isArray(state.pages)) state = seed();
  }
  editing = sessionStorage.getItem('codex-unlocked') === '1' && !!state.editHash;
  render();
})();
</script>
</body>
</html>
