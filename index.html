<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TLA Codex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Spectral:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08080b;
  --panel:#0e0e13;
  --panel2:#13131a;
  --line:#2a2417;
  --line2:#3a321f;
  --gold:#d9a441;
  --gold-soft:#e8c27a;
  --text:#d9ccaa;
  --muted:#8b8470;
  --green:#2fd69a;
  --aura:#8144e4;
  --nav-h:54px;
  --serif:"Cormorant Garamond","Palatino Linotype",Georgia,serif;
  --body:"Spectral",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nav-h) + 70px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:17px;line-height:1.65;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ---------- nav ---------- */
.nav{position:fixed;inset:0 0 auto 0;height:var(--nav-h);z-index:50;display:flex;align-items:center;gap:28px;padding:0 28px;background:rgba(8,8,11,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.logo{font-family:var(--serif);font-size:26px;color:var(--gold);letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.logo i{display:block;width:18px;height:18px;background:var(--gold);clip-path:polygon(50% 0,100% 40%,50% 100%,0 40%)}
.nav .links{display:flex;gap:26px;font-family:var(--serif);font-size:18px;font-weight:500}
.nav .links a{color:var(--muted)}
.nav .links a.on,.nav .links a:hover{color:#fff}
.nav .spacer{flex:1}
.navbreak{display:none}
.search{width:min(300px,34vw);background:var(--panel);border:1px solid var(--line2);border-radius:999px;padding:7px 16px;color:var(--text);font:14px var(--mono)}
.search::placeholder{color:var(--muted)}
.lockbtn{border:1px solid var(--gold);background:transparent;color:var(--gold);padding:8px 18px;font-family:var(--serif);font-weight:600;font-size:17px;letter-spacing:.04em}
.lockbtn:hover{background:var(--gold);color:#17110a}
body.editing .lockbtn{background:var(--gold);color:#17110a}

/* ---------- layout ---------- */
main{max-width:1240px;margin:0 auto;padding:calc(var(--nav-h) + 34px) 28px 140px}
.crumbs{font:13px var(--mono);color:var(--muted);margin-bottom:6px}
.crumbs a:hover{color:var(--gold)}
.crumbs span{margin:0 6px}
h1.title{font-family:var(--serif);font-weight:600;font-size:clamp(38px,5vw,60px);line-height:1.05;margin:0 0 26px;color:#f1e6c8}
h2{font-family:var(--serif);font-weight:600;color:var(--gold);margin:0}

/* ---------- editable fields ---------- */
.dash{color:var(--muted)}
body.editing input[type=text],body.editing textarea,body.editing select{
  width:100%;background:rgba(217,164,65,.06);border:1px dashed var(--line2);border-radius:2px;color:inherit;font:inherit;padding:2px 8px;margin:0;resize:none}
body.editing textarea{display:block;overflow:hidden;line-height:1.55}
body.editing input[type=text]:focus,body.editing textarea:focus,body.editing select:focus{border-color:var(--gold);background:rgba(217,164,65,.1);outline:none}
body.editing select{font-family:var(--mono);font-size:13px;padding:5px 8px;width:auto;background:var(--panel2);color:var(--text);color-scheme:dark;border:1px solid var(--line2);border-radius:0}
input[type=color]{width:22px;height:22px;padding:0;border:0;background:none;cursor:pointer;vertical-align:middle}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 368px;gap:24px;align-items:start}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);background:var(--panel)}
.stat{padding:16px 18px 18px;border-right:1px solid var(--line);min-width:0}
.stat:last-child{border-right:0}
.lbl{display:block;font:11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.stat .val{font-family:var(--serif);font-weight:600;font-size:20px;line-height:1.25;color:var(--gold-soft);overflow-wrap:anywhere}
.stat.ok .val{color:var(--green);font-family:var(--body);font-weight:400;font-size:17px}
body.editing .stat .val input,body.editing .stat .val textarea{font-family:inherit;font-size:inherit;font-weight:inherit}

.quote{margin:24px 0;padding:26px 28px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--aura)}
.quote p{margin:0 0 14px;font-family:var(--serif);font-style:italic;font-size:clamp(24px,2.6vw,32px);line-height:1.25;color:#f1e6c8}
.quote cite{display:block;font:12px var(--mono);letter-spacing:.1em;color:#6fa3a8;font-style:normal;text-transform:uppercase}
body.editing .quote p textarea{font-style:italic}

.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px}
.chip{display:flex;align-items:center;gap:10px;border:1px solid var(--line2);background:var(--panel);padding:8px 14px;font:12px var(--mono);letter-spacing:.06em;color:var(--gold-soft)}
.chip .k{color:var(--muted)}
.chip .dot{width:13px;height:13px;border-radius:50%;background:var(--aura)}
.chip input[type=text]{min-width:150px}

.overview{border:1px solid var(--line);background:linear-gradient(180deg,#101016,#0b0b10);padding:26px 28px}
.overview header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:16px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.overview h2{font-size:32px}
.overview .tag{font:11px var(--mono);letter-spacing:.1em;color:var(--gold-soft);border:1px solid var(--line2);padding:6px 10px}
.overview p{margin:0;color:var(--text)}

.portrait{position:sticky;top:calc(var(--nav-h) + 20px);border:1px solid var(--line);background:var(--panel);border-bottom:3px solid var(--aura)}
.portrait .top{display:flex;justify-content:space-between;padding:12px}
.badge{font:11px var(--mono);letter-spacing:.1em;padding:4px 10px;background:var(--gold);color:#17110a;max-width:60%}
.badge.out{background:transparent;border:1px solid var(--line2);color:var(--gold-soft)}
.portrait .frame{position:relative;aspect-ratio:3/4;margin:0 12px 14px;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--aura) 22%,transparent),transparent 70%),#0a0a0e;background-image:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--aura) 22%,transparent),transparent 70%),radial-gradient(#1c1a14 1px,transparent 1px);background-size:auto,14px 14px;display:grid;place-items:center;overflow:hidden}
.portrait img{width:100%;height:100%;object-fit:contain;display:block}
.frame .none{color:var(--muted);font:13px var(--mono);text-align:center;padding:20px}
.frame .tools{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}

/* ---------- buttons / drop zones ---------- */
.btn{border:1px solid var(--line2);background:var(--panel2);padding:7px 14px;font:13px var(--mono);color:var(--text)}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#17110a}
.btn.gold:hover{background:var(--gold-soft);color:#17110a}
.btn.danger:hover{border-color:#e0605c;color:#e0605c}
.btn.sm{padding:4px 9px;font-size:12px}
.edit-only{display:none}
body.editing .edit-only{display:inline-flex}
body.editing .edit-only.block{display:block}
.drop{border:1px dashed var(--line2);background:rgba(217,164,65,.04);color:var(--muted);font:13px var(--mono);padding:18px 12px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--gold);color:var(--gold);background:rgba(217,164,65,.1)}

/* ---------- mode switcher (sits next to the Move List heading) ---------- */
.modes{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 22px;padding-left:22px;border-left:1px solid var(--line2)}
.modes button{border:0;background:transparent;padding:0;font-family:var(--serif);font-weight:600;line-height:1.1;font-size:22px;color:#6b6657;transition:font-size .2s ease,color .2s ease}
.modes button:hover{color:#a69f88}
.modes button[aria-pressed=true]{font-size:40px;color:#fff;cursor:default}

/* ---------- moves ---------- */
.moves-head{margin:64px 0 22px;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 22px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.moves-head h2{font-size:38px}
.moves-head p{margin:0;flex-basis:100%;color:var(--muted);font-size:15px;font-style:italic}
.move{border:1px solid var(--line);background:var(--panel);margin-bottom:18px}
.move>header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:16px 22px;border-bottom:1px solid var(--line);background:var(--panel2)}
.move h3{margin:0;flex:1;min-width:180px;font-family:var(--serif);font-weight:600;font-size:28px;line-height:1.15;color:#f1e6c8}
.tools{gap:8px 10px;align-items:center;flex-wrap:wrap}
.keywrap{display:flex;align-items:center;gap:10px}
.keywrap:empty{display:none}
.keycap{min-width:42px;height:42px;padding:0 10px;display:inline-grid;place-items:center;font:500 16px var(--mono);text-transform:uppercase;color:var(--gold-soft);background:var(--panel);border:1px solid var(--line2);border-bottom-width:3px;border-radius:4px}
.held-tag{font:italic 500 13px var(--mono);color:var(--gold);white-space:nowrap}
.held-tag[hidden]{display:none}
body.editing input[type=text].keyin{width:78px;height:42px;padding:0 6px;text-align:center;font:500 16px var(--mono);text-transform:uppercase;color:var(--gold-soft);border-style:solid;border-bottom-width:3px;border-radius:4px}
.held-toggle{display:flex;align-items:center;gap:6px;font:12px var(--mono);color:var(--muted);cursor:pointer;user-select:none}
.held-toggle input{width:16px;height:16px;accent-color:var(--gold);margin:0;cursor:pointer}
.held-toggle:hover{color:var(--gold)}
.pill{font:11px var(--mono);letter-spacing:.08em;border:1px solid var(--line2);padding:3px 9px;color:var(--gold-soft);white-space:nowrap}
.pill.uni{color:var(--muted)}
.move-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,40%);gap:0}
.move-body.solo{grid-template-columns:1fr}
.fields{padding:20px 22px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 20px;align-content:start}
.field.wide{grid-column:1/-1}
.field .v{font-size:16px;overflow-wrap:anywhere}
.field.wide .v{font-size:17px}
.media{padding:20px 22px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.thumb{margin:0;position:relative;border:1px solid var(--line2);background:#0a0a0e;aspect-ratio:16/10;display:grid;place-items:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.thumb .x,.vid .x,.linkcard .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border:0;background:rgba(8,8,11,.85);color:#fff;line-height:1;font-size:16px}
.thumb .x:hover,.vid .x:hover,.linkcard .x:hover{background:#c0443f}
.vids{display:grid;gap:10px}
.vid{position:relative;aspect-ratio:16/9;border:1px solid var(--line2);background:#000}
.vid iframe{width:100%;height:100%;border:0;display:block}
.vid video{width:100%;height:100%;display:block;object-fit:contain;background:#000}
.linkcard{position:relative;display:flex;flex-direction:column;border:1px solid var(--line2);background:var(--panel2);padding:10px 36px 10px 14px;min-width:0}
.linkcard a{color:var(--gold-soft);font:14px var(--mono)}
.linkcard a:hover{text-decoration:underline}
.linkcard .u{font:12px var(--mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkadd{display:flex;gap:8px}
.linkadd input{flex:1;min-width:0}
/* block / parry toggles */
.togs{display:flex;flex-wrap:wrap;gap:6px}
.tog{position:relative;display:inline-flex;cursor:pointer}
.tog input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer}
.tog span,.tog.ro{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;font:13px var(--mono);border:1px solid var(--line2);color:var(--muted);background:var(--panel2);user-select:none}
.tog span::before{content:"";width:13px;height:13px;border:1px solid var(--muted);display:inline-block;font-size:10px;line-height:11px;text-align:center}
.tog:hover span{border-color:var(--gold);color:var(--gold-soft)}
.tog input:checked + span{background:var(--gold);border-color:var(--gold);color:#17110a}
.tog input:checked + span::before{content:"✓";background:#17110a;border-color:#17110a;color:var(--gold)}
.tog input:focus-visible + span{outline:2px solid var(--gold);outline-offset:2px}
.tog.ro{cursor:default}
.tog.ro i{font-style:normal}
.tog.ro.on{border-color:var(--gold);color:var(--gold-soft)}
.tog.ro.on b{color:var(--green)}
.tog.ro:not(.on) b{color:#e0605c}
.tog.ro:not(.on) i{text-decoration:line-through}
.note{margin-top:8px;font-size:15px}
body.editing .togs + input[type=text]{margin-top:8px}
.empty{border:1px dashed var(--line2);padding:46px 20px;text-align:center;color:var(--muted);font-style:italic}

/* ---------- home ---------- */
.home-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:14px;margin-bottom:26px}
.home-head h1{margin:0;font-family:var(--serif);font-size:clamp(40px,6vw,68px);font-weight:600;line-height:1;color:#f1e6c8}
.home-head p{margin:8px 0 0;color:var(--muted);max-width:52ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.pcard{position:relative;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;transition:border-color .15s,transform .15s}
.pcard:hover{border-color:var(--gold);transform:translateY(-2px)}
.pcard .img{aspect-ratio:4/3;background:#0a0a0e;display:grid;place-items:center;border-bottom:3px solid var(--c,var(--aura));overflow:hidden}
.pcard img{width:100%;height:100%;object-fit:cover;object-position:top}
.pcard .img span{font-family:var(--serif);font-size:56px;color:var(--line2)}
.pcard .meta{padding:14px 16px 16px}
.pcard h3{margin:0;font-family:var(--serif);font-size:26px;font-weight:600;color:#f1e6c8;line-height:1.1}
.pcard .meta p{margin:4px 0 0;font:12px var(--mono);color:var(--muted)}
.pcard .acts{position:absolute;top:8px;right:8px;gap:6px}

/* ---------- titlebar / quests / keywording ---------- */
.titlebar{display:flex;flex-wrap:wrap;align-items:flex-start;gap:10px 18px}
.titlebar h1.title{flex:1;min-width:240px}
.titlebar .acts2{margin-top:10px;gap:8px}
.lead{max-width:70ch;margin:-6px 0 10px;font-size:19px}
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:46px 0 18px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.qhead h2{font-size:36px}
.cast{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.cast .empty{grid-column:1/-1}
.char{border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
.char .cimg{aspect-ratio:3/4;background:#0a0a0e;display:grid;place-items:center;border-bottom:3px solid var(--aura);overflow:hidden}
.char .cimg img{width:100%;height:100%;object-fit:cover;object-position:top;cursor:zoom-in}
.char .cimg span{font:600 64px var(--serif);color:var(--line2)}
.char .cbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.char h3{margin:0;font:600 24px/1.1 var(--serif);color:#f1e6c8}
.char .role{margin:0;font:12px var(--mono);color:var(--muted)}
.char .drop{padding:10px 8px;font-size:12px}
.row2{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}

.blk{margin-bottom:16px}
.blk.hd{margin:44px 0 18px;padding-bottom:12px;border-bottom:1px solid var(--line2);display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.blk.hd h3{flex:1;margin:0;min-width:200px;font:600 clamp(28px,3vw,38px)/1.1 var(--serif);color:var(--gold)}
.blk.card{border:1px solid var(--line);background:var(--panel)}
.blk.card>header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--panel2)}
.dlabel{flex:1;min-width:160px;font:italic 500 21px var(--serif);color:var(--gold-soft)}
body.editing .dlabel input{font-family:var(--serif);font-size:21px;font-style:italic}
.lines{padding:6px 22px}
.line{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
body:not(.editing) .line{grid-template-columns:52px minmax(0,1fr)}
.av{width:52px;height:52px;border-radius:50%;object-fit:cover;object-position:top;border:2px solid var(--line2);background:#0a0a0e;display:grid;place-items:center;font:600 22px var(--serif);color:var(--muted)}
.av.sys{font:500 11px var(--mono);letter-spacing:.06em}
.spk{display:block;font:12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--gold-soft);margin-bottom:3px}
.line.player .spk{color:#7fb7ff}
.line.narrator .ltext{font-style:italic;color:var(--muted)}
body.editing .line select{margin-bottom:6px}
.ltext{font-size:18px;overflow-wrap:anywhere}

.blk.opt{border-left:4px solid var(--aura)}
.pill.optp{color:#b79cff;border-color:#5b3fa0}
.prompt{padding:18px 22px 6px;font:italic 500 clamp(22px,2.3vw,28px)/1.3 var(--serif);color:#f1e6c8}
.prompt textarea{font-style:italic}
.choices{padding:10px 22px 18px;display:grid;gap:10px}
.choice{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:14px;align-items:start;border:1px solid var(--line2);background:var(--panel2);padding:14px 16px}
body:not(.editing) .choice{grid-template-columns:34px minmax(0,1fr)}
.cnum{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--gold);color:var(--gold);font:500 14px var(--mono)}
.clabel{font:600 22px/1.25 var(--serif);color:#f1e6c8}
body.editing .clabel input{font-family:var(--serif);font-size:22px;font-weight:600}
.coutcome{margin-top:8px}
.coutcome .lbl{margin-bottom:4px}
.addrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

.kw{border:1px solid var(--line);background:var(--panel);margin-bottom:14px}
.kw>header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--panel2)}
.kw h3{flex:1;min-width:180px;margin:0;font:600 28px/1.15 var(--serif);color:#f1e6c8}
.kw .kbody{padding:18px 22px;display:grid;gap:14px}
.kw .ktext{font-size:17px;overflow-wrap:anywhere}

.blkmedia{padding:0 22px 20px;display:flex;flex-direction:column;gap:12px}

/* stand stats */
.statscard{margin-bottom:24px}
.statsbody{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:30px;align-items:center}
.statchart svg{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 18px rgba(0,0,0,.6))}
.standname{margin-top:12px;text-align:center;font:600 32px/1.1 var(--serif);color:color-mix(in srgb,var(--aura) 72%,#fff);text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000,0 0 14px color-mix(in srgb,var(--aura) 55%,transparent)}
body.editing .standname input{text-align:center;font:inherit;font-size:26px;text-shadow:none}
.slist{display:grid}
.srow{display:grid;grid-template-columns:1fr auto 54px;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}
.sname{font:12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sval{display:flex;align-items:center;gap:6px;font:500 18px var(--mono);color:var(--gold-soft)}
.sval em{font-style:normal;font-size:12px;color:var(--muted)}
.sletter{font:600 36px/1 var(--serif);color:#fff;text-align:center}
.srow input[type=number]{width:78px;background:rgba(217,164,65,.06);border:1px dashed var(--line2);color:var(--gold-soft);font:500 17px var(--mono);padding:3px 8px;color-scheme:dark}
.srow input[type=number]:focus{border-color:var(--gold);outline:none}
.shint{margin:12px 0 0;font:12px/1.5 var(--mono);color:var(--muted)}

<script>
/* =====================================================================
   TLA Codex — static site for GitHub Pages
   - Everyone sees what is in data.json (the published copy)
   - The creator unlocks edit mode with a passphrase, edits happen in a
     local draft, then "Export data.json" and commit it to the repo
   ===================================================================== */

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const clone = o => JSON.parse(JSON.stringify(o));
const listJoin = a => a.length <= 1 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];

/* ---------- keybinds ---------- */
const KEY_ORDER = ['M1','M2','E','R','T','Y','G','H','J','X','V','B','Z','K'];
// Looks at the moves already in the list (last one first) and returns the next key in KEY_ORDER.
function nextKey(list) {
  for (let i = list.length - 1; i >= 0; i--) {
    const idx = KEY_ORDER.indexOf((list[i].key || '').trim().toUpperCase());
    if (idx !== -1) return KEY_ORDER[idx + 1] || '';
  }
  return KEY_ORDER[0];
}

/* ---------- modes (per ability sheet) ---------- */
const defaultModes = () => [
  { id: 'universal', name: 'Universal', links: [] },
  { id: 'off', name: 'Stand Off', links: ['universal'] },
  { id: 'on',  name: 'Stand On',  links: ['universal'] }
];
const modeById = (p, id) => p.modes.find(m => m.id === id);
const modeName = (p, id) => (modeById(p, id) || { name: 'Universal' }).name || 'Mode';
// every mode whose moves show up when viewing `id` (itself + everything it links to, transitively)
function closure(p, id) {
  const seen = new Set();
  const walk = i => { if (seen.has(i)) return; seen.add(i); ((modeById(p, i) || {}).links || []).forEach(walk); };
  walk(id);
  return seen;
}
function modeNote(p) {
  const mo = modeById(p, tab); if (!mo) return '';
  const names = mo.links.filter(id => modeById(p, id)).map(id => modeName(p, id));
  if (!names.length) return tab === 'universal' ? 'Moves every linked mode can use.' : `Moves that belong to ${mo.name} only.`;
  return `Everything in ${listJoin(names)}, plus moves that only belong to ${mo.name}.`;
}

/* ---------- stand stats ---------- */
// angles run clockwise from the top of the chart
const STAT_DEFS = [
  { key: 'power',      label: 'Power',      angle: 0 },
  { key: 'speed',      label: 'Speed',      angle: 60 },
  { key: 'range',      label: 'Range',      angle: 120 },
  { key: 'durability', label: 'Durability', angle: 180 },
  { key: 'precision',  label: 'Precision',  angle: 240 },
  { key: 'potential',  label: 'Potential',  angle: 300 }
];
const gradeOf = v => v >= 80 ? 'A' : v >= 60 ? 'B' : v >= 40 ? 'C' : v >= 20 ? 'D' : 'E';
const clampStat = v => { v = Math.round(parseFloat(v)); return Number.isFinite(v) ? Math.max(0, Math.min(100, v)) : 0; };
function normStats(p) {
  const old = p.stats && typeof p.stats === 'object' ? p.stats : {};
  p.stats = {}; STAT_DEFS.forEach(d => { p.stats[d.key] = clampStat(old[d.key]); });
  p.standName = p.standName || '';
}
const hasStats = p => STAT_DEFS.some(d => p.stats[d.key] > 0);

/* ---------- migration of older saved data ---------- */
function migrateMove(m) {
  m.images = m.images || []; m.links = m.links || [];
  if (typeof m.blockable !== 'boolean') {
    const t = (m.block || '').trim();
    m.blockable = /blockable/i.test(t) && !/unblockable|not blockable|cannot be blocked/i.test(t);
    m.paryable  = /paryable|parr(y|ied)/i.test(t) && !/unparr|not parr|cannot be parr|unparyable|not paryable/i.test(t);
    m.block = t.replace(/^(?:(?:(?:un)?blockable|paryable|none)\s*[,;.:-]*\s*)+/i, '');
  }
  if (typeof m.paryable !== 'boolean') m.paryable = false;
}
function migratePage(p) {
  p.moves = p.moves || []; normStats(p);
  if (!Array.isArray(p.modes) || !p.modes.length) p.modes = defaultModes();
  if (!p.modes.some(m => m.id === 'universal')) p.modes.unshift({ id: 'universal', name: 'Universal', links: [] });
  p.modes.forEach(m => { m.name = m.name || 'Mode'; if (!Array.isArray(m.links)) m.links = m.id === 'universal' ? [] : ['universal']; });
  p.moves.forEach(m => { migrateMove(m); if (!p.modes.some(x => x.id === m.mode)) m.mode = 'universal'; });
}
function migrateQuest(q) {
  q.summary = q.summary || ''; q.characters = q.characters || []; q.blocks = q.blocks || [];
  q.characters.forEach(c => { c.image = c.image || ''; c.role = c.role || ''; });
  q.blocks.forEach(b => { if (b.type === 'dialogue') b.lines = b.lines || []; if (b.type === 'options') b.choices = b.choices || []; if (b.type !== 'header') { b.images = b.images || []; b.links = b.links || []; } });
}
function migrateState(st) {
  st.pages = st.pages || []; st.quests = st.quests || []; st.keywords = st.keywords || [];
  st.pages.forEach(migratePage); st.quests.forEach(migrateQuest);
  st.keywords.forEach(k => { if (k.type === 'entry') { k.images = k.images || []; k.links = k.links || []; } });
  return st;
}

/* ---------- links / video helpers ---------- */
const VIDEO_EXT = /\.(mp4|webm|ogv|mov|m4v)$/i;
function parseLink(raw) {
  raw = (raw || '').trim(); if (!raw) return null;
  if (/^data:video\/[\w.+-]+;base64,/i.test(raw)) return raw;               // small clip stored inside the site data
  const first = raw.split('/')[0];
  const looksLikeDomain = raw.includes('/') && first.includes('.');
  if (!/^[a-z][a-z0-9+.-]*:/i.test(raw) && !looksLikeDomain && !raw.startsWith('/') && !raw.includes('..') &&
      /^[\w\-. %()/]+$/.test(raw) && VIDEO_EXT.test(raw)) return raw.replace(/\\/g, '/'); // file inside the repo, e.g. videos/clip.mp4
  try {
    const u = new URL(/^https?:\/\//i.test(raw) ? raw : 'https://' + raw);
    return /^https?:$/.test(u.protocol) && u.hostname.includes('.') ? u.href : null;
  } catch { return null; }
}
function ytId(href) {
  try {
    const u = new URL(href), h = u.hostname.replace(/^(www|m|music)\./, '');
    let id = null;
    if (h === 'youtu.be') id = u.pathname.slice(1).split('/')[0];
    else if (h === 'youtube.com' || h === 'youtube-nocookie.com') {
      if (u.pathname === '/watch') id = u.searchParams.get('v');
      else { const m = u.pathname.match(/^\/(?:embed|shorts|live|v)\/([\w-]+)/); if (m) id = m[1]; }
    }
    if (!id || !/^[\w-]{6,20}$/.test(id)) return null;
    let start = 0; const t = u.searchParams.get('t') || u.searchParams.get('start');
    const mm = t && t.match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s?)?$/);
    if (mm) start = (+mm[1] || 0) * 3600 + (+mm[2] || 0) * 60 + (+mm[3] || 0);
    return { id, start };
  } catch { return null; }
}

// Vimeo and Streamable pages that can be embedded
function embedSrc(href) {
  try {
    const u = new URL(href), h = u.hostname.replace(/^www\./, '');
    let m;
    if (h === 'vimeo.com' && (m = u.pathname.match(/^\/(\d+)/))) return 'https://player.vimeo.com/video/' + m[1];
    if (h === 'streamable.com' && (m = u.pathname.match(/^\/(?:e\/)?(\w+)$/))) return 'https://streamable.com/e/' + m[1];
  } catch {}
  return null;
}
// a video file we can play with the browser's own player (inline clip, repo file, or direct .mp4 link)
function fileVideo(href) {
  if (/^data:video\//i.test(href)) return href;
  if (!/^https?:/i.test(href)) return encodeURI(href);
  try { if (VIDEO_EXT.test(new URL(href).pathname)) return href; } catch {}
  return null;
}

/* ---------- generic helpers ---------- */
// find any object with a given id anywhere inside a document (page, quest or keyword list)
function findObj(root, id) {
  if (!root || typeof root !== 'object') return null;
  if (Array.isArray(root)) { for (const x of root) { const r = findObj(x, id); if (r) return r; } return null; }
  if (root.id === id) return root;
  for (const k in root) { const v = root[k]; if (v && typeof v === 'object') { const r = findObj(v, id); if (r) return r; } }
  return null;
}
function swap(arr, id, dir) {
  const i = arr.findIndex(x => x.id === id), j = i + dir;
  if (i < 0 || j < 0 || j >= arr.length) return false;
  [arr[i], arr[j]] = [arr[j], arr[i]]; return true;
}

/* ---------- data ---------- */
const blankPage = (name = 'New Character') => ({
  id: uid(), name,
  rarity: 'High Tier', part: 'Part 1', type: 'Class - Role', status: 'Confirmed',
  quote: 'Your signature line goes here', quoteLabel: 'Signature line',
  aura: '#8144e4', arc: 'Featured arc', playable: 'Confirmed playable',
  overview: 'Write the character overview here.',
  portrait: '', stats: { power: 0, speed: 0, range: 0, durability: 0, precision: 0, potential: 0 }, standName: '', modes: defaultModes(), moves: []
});
const blankMove = (mode = 'universal') => ({
  id: uid(), mode, key: '', held: false, name: 'New Move', does: '', meter: '', blockable: false, paryable: false, block: '', armor: '', images: [], links: []
});
const blankQuest = (name = 'New Quest') => ({ id: uid(), name, summary: '', characters: [], blocks: [] });
const blankChar = () => ({ id: uid(), name: 'New Character', role: '', image: '' });
const blankBlock = type => {
  if (type === 'header')   return { id: uid(), type, text: 'New section' };
  if (type === 'dialogue') return { id: uid(), type, label: '', lines: [{ id: uid(), speaker: 'narrator', text: '' }], images: [], links: [] };
  return { id: uid(), type: 'options', prompt: 'What will you do?', choices: [{ id: uid(), label: 'Option 1', outcome: '' }, { id: uid(), label: 'Option 2', outcome: '' }], images: [], links: [] };
};
const seed = () => {
  const p = blankPage('Example Character');
  p.overview = 'This is a sample sheet. Unlock edit mode, then change any text, drop in a portrait, and add moves to each mode.';
  p.stats = { power: 90, speed: 80, range: 35, durability: 95, precision: 88, potential: 84 }; p.standName = 'Example Stand';
  p.moves = [
    { id: uid(), mode:'universal', key:'M1', held:false, name:'Light Combo', does:'Four-hit string that ends in a knockdown.', meter:'0', blockable:true, paryable:true, block:'', armor:'None', images:[], links:[] },
    { id: uid(), mode:'universal', key:'M2', held:false, name:'Grab', does:'Close range throw. Cannot be blocked.', meter:'0', blockable:false, paryable:false, block:'', armor:'None', images:[], links:[] },
    { id: uid(), mode:'off',       key:'E', held:false, name:'Off-Mode Barrage', does:'Rapid flurry that pushes the opponent back.', meter:'25%', blockable:true, paryable:true, block:'Chip damage', armor:'Light armor on startup', images:[], links:[] },
    { id: uid(), mode:'on',        key:'E', held:true, name:'On-Mode Heavy Strike', does:'Slow, powerful hit with a long wind-up.', meter:'50%', blockable:true, paryable:false, block:'Guard break', armor:'Super armor', images:[], links:[] }
  ];
  const q = blankQuest('Example Quest');
  q.summary = 'A sample quest showing characters, dialogue and a choice.';
  const guide = { id: uid(), name: 'The Guide', role: 'Quest giver', image: '' };
  q.characters = [guide];
  q.blocks = [
    { id: uid(), type: 'header', text: 'Chapter 1: The Meeting' },
    { id: uid(), type: 'dialogue', label: 'At the docks', lines: [
      { id: uid(), speaker: 'narrator', text: 'A stranger waves you over.' },
      { id: uid(), speaker: guide.id, text: 'You look like someone who can handle trouble.' } ] },
    { id: uid(), type: 'options', prompt: 'Will you help?', choices: [
      { id: uid(), label: 'Accept', outcome: 'The quest begins.' },
      { id: uid(), label: 'Decline', outcome: 'The guide walks away.' } ] }
  ];
  const kws = [
    { id: uid(), type: 'header', text: 'Defense' },
    { id: uid(), type: 'entry', name: 'Armor', text: 'While a move has armor, hits do not interrupt it. Super armor ignores all hits; light armor only ignores one.', images: [] },
    { id: uid(), type: 'entry', name: 'Held', text: 'A held move keeps charging for as long as its key stays down.', images: [] }
  ];
  return { editHash: '', pages: [p], quests: [q], keywords: kws };
};

let state = null;
let editing = false;
let tab = 'universal';
let lastSection = null;

/* ---------- local draft storage (IndexedDB, so big images fit) ---------- */
const idb = {
  db: null,
  open() {
    return this.db || (this.db = new Promise((res, rej) => {
      const r = indexedDB.open('move-codex', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    }));
  },
  async get(k) { const db = await this.open(); return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  async set(k, v) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); },
  async del(k) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').delete(k); t.oncomplete = res; t.onerror = () => rej(t.error); }); }
};

let saveTimer;
function save() {
  if (!editing) return;
  $('#saveState').textContent = 'Saving…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 350);
}
async function saveNow() {
  try { await idb.set('draft', state); $('#saveState').textContent = 'Draft saved'; }
  catch (e) { $('#saveState').textContent = 'Could not save draft'; }
}

/* ---------- passphrase gate ---------- */
async function sha(s) {
  const text = 'codex:' + s;
  if (window.crypto && crypto.subtle) {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
  }
  let h = 5381; for (const c of text) h = ((h << 5) + h + c.charCodeAt(0)) | 0; return 'x' + h;
}
function openAuth() {
  const first = !state.editHash;
  $('#authTitle').textContent = first ? 'Set your edit passphrase' : 'Unlock editing';
  $('#authText').textContent = first
    ? 'Choose a passphrase (6+ characters). Export data.json afterwards so it is saved with your site.'
    : 'Enter your passphrase to edit pages.';
  $('#authOk').textContent = first ? 'Set passphrase' : 'Unlock';
  $('#authPw').value = ''; $('#authErr').textContent = '';
  $('#authDlg').showModal();
  $('#authPw').focus();
}
$('#authCancel').onclick = () => $('#authDlg').close();
$('#authForm').onsubmit = async e => {
  e.preventDefault();
  const pw = $('#authPw').value;
  if (!pw) return;
  const h = await sha(pw);
  if (!state.editHash) {
    if (pw.length < 6) { $('#authErr').textContent = 'Use at least 6 characters.'; return; }
    state.editHash = h; await saveNow();
  } else if (state.editHash !== h) {
    $('#authErr').textContent = 'Wrong passphrase.'; return;
  }
  sessionStorage.setItem('codex-unlocked', '1');
  editing = true;
  $('#authDlg').close();
  render();
  toast('Edit mode on');
};
function lock() {
  sessionStorage.removeItem('codex-unlocked');
  editing = false;
  render();
}
$('#lockBtn').onclick = () => editing ? lock() : openAuth();

/* ---------- routing ---------- */
function route() {
  const h = location.hash; let m, d;
  if ((m = h.match(/^#\/p\/(.+)$/)) && (d = state.pages.find(x => x.id === m[1]))) return { kind: 'ability', doc: d };
  if ((m = h.match(/^#\/q\/(.+)$/)) && (d = state.quests.find(x => x.id === m[1]))) return { kind: 'quest', doc: d };
  if (h === '#/quests') return { kind: 'quests' };
  if (h === '#/keywording') return { kind: 'keywording', doc: state.keywords };
  return { kind: 'abilities' };
}

function statsSVG(p) {
  const C = 210, R = 100;
  const pt = (a, r) => { const t = a * Math.PI / 180; return [C + r * Math.sin(t), C - r * Math.cos(t)]; };
  const f = n => n.toFixed(1);
  let o = `<svg viewBox="0 0 420 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stand stats chart" font-family="Arial, Helvetica, sans-serif">`;
  o += `<circle cx="${C}" cy="${C}" r="200" fill="#fff"/>`;
  for (let i = 0; i < 48; i++) {                       // thick tick ring
    const [x1, y1] = pt(i * 7.5, 186), [x2, y2] = pt(i * 7.5, 198);
    o += `<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" stroke="#111" stroke-width="5"/>`;
  }
  o += `<circle cx="${C}" cy="${C}" r="181" fill="none" stroke="#111" stroke-width="1.5"/>`;
  // filled shape
  const poly = STAT_DEFS.map(d => pt(d.angle, p.stats[d.key] / 100 * R).map(f).join(',')).join(' ');
  o += `<polygon points="${poly}" style="fill:var(--aura);fill-opacity:.78"/>`;
  // axes + tick marks
  STAT_DEFS.forEach(d => {
    const [x, y] = pt(d.angle, R);
    o += `<line x1="${C}" y1="${C}" x2="${f(x)}" y2="${f(y)}" stroke="#111" stroke-width="1"/>`;
    const t = d.angle * Math.PI / 180, px = Math.cos(t), py = Math.sin(t);
    for (let k = 1; k < 10; k++) {
      const [cx, cy] = pt(d.angle, k * 10);
      o += `<line x1="${f(cx - px * 3)}" y1="${f(cy - py * 3)}" x2="${f(cx + px * 3)}" y2="${f(cy + py * 3)}" stroke="#111" stroke-width="1"/>`;
    }
  });
  o += `<circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="#111" stroke-width="1.5"/>`;
  // A–E scale up the top axis
  ['A', 'B', 'C', 'D', 'E'].forEach((g, i) => {
    const [x, y] = pt(0, [90, 70, 50, 30, 10][i]);
    o += `<text x="${f(x + 7)}" y="${f(y)}" font-size="11" font-weight="700" dominant-baseline="central" style="fill:var(--aura)">${g}</text>`;
  });
  // labels + big grade letters
  STAT_DEFS.forEach(d => {
    const rot = d.angle > 90 && d.angle < 270 ? d.angle - 180 : d.angle;
    const [lx, ly] = pt(d.angle, 163), [gx, gy] = pt(d.angle, 132);
    o += `<text transform="translate(${f(lx)} ${f(ly)}) rotate(${rot})" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="700" letter-spacing="1.5" fill="#111">${d.label.toUpperCase()}</text>`;
    o += `<text x="${f(gx)}" y="${f(gy)}" text-anchor="middle" dominant-baseline="central" font-size="34" fill="#111">${gradeOf(p.stats[d.key])}</text>`;
  });
  return o + '</svg>';
}

function statsCard(p) {
  if (!editing && !hasStats(p)) return '';
  const rows = STAT_DEFS.map(d => {
    const v = p.stats[d.key];
    return `<div class="srow"><span class="sname">${d.label}</span>
      ${editing
        ? `<span class="sval"><input type="number" min="0" max="100" step="1" inputmode="numeric" data-stat="${d.key}" value="${v}" aria-label="${d.label} rating out of 100"><em>/ 100</em></span>`
        : `<span class="sval">${v}<em>/ 100</em></span>`}
      <span class="sletter" data-letter="${d.key}">${gradeOf(v)}</span></div>`;
  }).join('');
  return `
    <div class="card overview statscard">
      <header><h2>Stand Stats</h2><span class="tag">Stand data</span></header>
      <div class="statsbody">
        <div class="statchart">

        </div>
        <div class="slist">${rows}

        </div>

}

function linksHTML(m) {
  return (m.links || []).map((raw, n) => {
    const href = parseLink(raw); if (!href) return '';
    const rm = editing ? `<button class="x" data-act="del-link" data-m="${m.id}" data-i="${n}" aria-label="Remove video or link">×</button>` : '';
    const title = esc(m.name || 'Video');
    const yt = ytId(href);
    const frame = src => `<div class="vid"><iframe src="${src}" title="${title}" loading="lazy" allow="accelerometer; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>${rm}</div>`;
    if (yt) return frame(`https://www.youtube-nocookie.com/embed/${yt.id}${yt.start ? '?start=' + yt.start : ''}`);
    const emb = embedSrc(href); if (emb) return frame(emb);
    const file = fileVideo(href);
    if (file) return `<div class="vid"><video controls preload="metadata" playsinline src="${esc(file)}"></video>${rm}</div>`;
    let host = href; try { host = new URL(href).hostname.replace(/^www\./, ''); } catch {}
    return `<div class="linkcard"><a href="${esc(href)}" target="_blank" rel="noopener noreferrer">↗ ${esc(host)}</a><span class="u">${esc(href)}</span>${rm}</div>`;
  }).join('');
}

}

/* ---- copy a moveset ---- */
let copyInto = 'universal';
function openCopy(p) {
  $('#cpSrc').innerHTML = state.pages.map(x => `<option value="${x.id}">${esc(x.name || 'Untitled')}${x.id === p.id ? ' (this sheet)' : ''}</option>`).join('');
  const other = state.pages.find(x => x.id !== p.id);
  $('#cpSrc').value = (other || p).id;
  $('#cpReplace').checked = false;
  copyInto = tab;
  fillCopy(p);
  $('#copyDlg').showModal();
}
function fillCopy(p) {
  const src = state.pages.find(x => x.id === $('#cpSrc').value) || p;
  const parts = [];
  if (src.id !== p.id) parts.push(`<option value="all">Everything (all modes)</option>`);
  src.modes.forEach(m => parts.push(`<option value="${m.id}">Only “${esc(m.name)}” moves</option>`));
  $('#cpPart').innerHTML = parts.join('');
  $('#cpInto').innerHTML = p.modes.map(m => `<option value="${m.id}" ${m.id === copyInto ? 'selected' : ''}>${esc(m.name)}</option>`).join('');
  updateCopyUI();
}
function updateCopyUI() {
  const all = $('#cpPart').value === 'all';
  $('#cpIntoWrap').hidden = all;
  $('#cpHint').textContent = all
    ? 'Modes are matched by name. Any that are missing get created on this sheet.'
    : 'Copies only the moves that belong to that mode, not ones it borrows from other modes.';
}
function copyMoveset(dst, src, part, into, replace) {
  const srcMoves = clone(src.moves);          // snapshot, so copying within one sheet is safe
  const put = (m, mode) => { const c = clone(m); c.id = uid(); c.mode = mode; dst.moves.push(c); };
  let n = 0;
  if (part === 'all') {
    const map = {}, fresh = [];
    src.modes.forEach(sm => {
      let dm = dst.modes.find(x => x.name.trim().toLowerCase() === sm.name.trim().toLowerCase());
      if (!dm) { dm = { id: uid(), name: sm.name, links: [] }; dst.modes.push(dm); fresh.push([dm, sm]); }
      map[sm.id] = dm.id;
    });
    fresh.forEach(([dm, sm]) => { dm.links = sm.links.map(l => map[l]).filter(Boolean); });
    if (replace) dst.moves = [];
    srcMoves.forEach(m => { put(m, map[m.mode] || 'universal'); n++; });
  } else {
    if (replace) dst.moves = dst.moves.filter(m => m.mode !== into);
    srcMoves.filter(m => m.mode === part).forEach(m => { put(m, into); n++; });
  }
  return n;
}
$('#cpCancel').onclick = () => $('#copyDlg').close();
$('#cpSrc').onchange = () => { const r = route(); if (r.kind === 'ability') fillCopy(r.doc); };
$('#cpPart').onchange = updateCopyUI;
$('#copyForm').onsubmit = e => {
  e.preventDefault();
  const r = route(); if (r.kind !== 'ability' || !editing) return;
  const src = state.pages.find(x => x.id === $('#cpSrc').value); if (!src) return;
  const n = copyMoveset(r.doc, src, $('#cpPart').value, $('#cpInto').value, $('#cpReplace').checked);
  $('#copyDlg').close(); save(); renderMoves(r.doc);
  toast(`Copied ${n} move${n === 1 ? '' : 's'}`);
};

/* ---------- editing: clicks ---------- */
const EDIT_ACTS = new Set(['new-page','del-page','dup-page','new-quest','del-quest','dup-quest','add-move','del-move','up','down','del-img','del-portrait','add-link','del-link','add-mode','del-mode','copy-moves','add-char','del-char','del-char-img','add-blk','del-blk','blk-up','blk-down','add-line','del-line','line-up','line-down','add-choice','del-choice','kw-add','kw-del','kw-up','kw-down']);
const focusId = id => { const el = id && $(`[data-id="${id}"]`); if (el) el.scrollIntoView({ block: 'center' }); };

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act],[data-pick]');
  if (!el) return;
  const act = el.dataset.act;
  const r = route(), doc = r.doc;
  if (!editing && EDIT_ACTS.has(act)) return;

  if (el.dataset.pick && !act) { pickTarget = el.dataset.pick; $('#filePick').click(); return; }

  switch (act) {
    case 'tab': tab = el.dataset.tab; renderMoves(doc); break;
    case 'zoom': $('#lightbox img').src = el.src; $('#lightbox').classList.add('show'); break;

    /* ----- abilities ----- */
    case 'new-page': { const np = blankPage(); state.pages.push(np); save(); location.hash = '#/p/' + np.id; break; }
    case 'del-page':
      e.preventDefault(); e.stopPropagation();
      if (confirm('Delete this ability sheet and all of its moves?')) { state.pages = state.pages.filter(x => x.id !== el.dataset.id); save(); render(); }
      break;
    case 'dup-page': {
      e.preventDefault(); e.stopPropagation();
      const i = state.pages.findIndex(x => x.id === el.dataset.id); if (i < 0) break;
      const c = clone(state.pages[i]); c.id = uid(); c.name = (c.name || 'Untitled') + ' (Copy)';
      c.moves.forEach(m => { m.id = uid(); });
      state.pages.splice(i + 1, 0, c); save();
      toast('Duplicated. You are now editing the copy.');
      if (r.kind === 'ability') location.hash = '#/p/' + c.id; else render();
      break;
    }
    case 'add-move': {
      const m = blankMove(tab); m.key = nextKey(visibleMoves(doc)); doc.moves.push(m); save(); renderMoves(doc); focusId(m.id); break;
    }
    case 'del-move':
      if (confirm('Delete this move?')) { doc.moves = doc.moves.filter(m => m.id !== el.dataset.m); save(); renderMoves(doc); }
      break;
    case 'up': case 'down': {
      const vis = visibleMoves(doc), i = vis.findIndex(m => m.id === el.dataset.m);
      const j = act === 'up' ? i - 1 : i + 1;
      if (i < 0 || j < 0 || j >= vis.length) break;
      const a = doc.moves.indexOf(vis[i]), b = doc.moves.indexOf(vis[j]);
      [doc.moves[a], doc.moves[b]] = [doc.moves[b], doc.moves[a]];
      save(); renderMoves(doc); focusId(el.dataset.m);
      break;
    }
    case 'del-portrait': doc.portrait = ''; save(); render(); break;
    case 'add-link': {
      const o = findObj(doc, el.dataset.m); if (!o) break;
      const inp = el.closest('.linkadd').querySelector('input');
      const href = parseLink(inp.value);
      if (!href) { toast('That does not look like a valid link or video path'); break; }
      (o.links = o.links || []).push(href); save(); refresh(); break;
    }
    case 'del-link': { const o = findObj(doc, el.dataset.m); if (o && o.links) { o.links.splice(+el.dataset.i, 1); save(); refresh(); } break; }
    case 'del-img': { const o = findObj(doc, el.dataset.m); if (o && o.images) { o.images.splice(+el.dataset.i, 1); save(); refresh(); } break; }

    case 'add-mode': {
      const mo = { id: uid(), name: 'New Mode', links: ['universal'] };
      doc.modes.push(mo); tab = mo.id; save(); renderMoves(doc);
      const inp = $('.modepanel input[type=text]'); if (inp) { inp.focus(); inp.select(); }
      break;
    }
    case 'del-mode': {
      const mo = modeById(doc, tab); if (!mo || tab === 'universal') break;
      if (!confirm(`Delete the mode “${mo.name}”? Its own moves will be moved to Universal.`)) break;
      doc.moves.forEach(m => { if (m.mode === tab) m.mode = 'universal'; });
      doc.modes = doc.modes.filter(x => x.id !== tab);
      doc.modes.forEach(x => { x.links = x.links.filter(l => l !== tab); });
      tab = 'universal'; save(); renderMoves(doc); break;
    }
    case 'copy-moves': openCopy(doc); break;

    /* ----- quests ----- */
    case 'new-quest': { const nq = blankQuest(); state.quests.push(nq); save(); location.hash = '#/q/' + nq.id; break; }
    case 'del-quest':
      e.preventDefault(); e.stopPropagation();
      if (confirm('Delete this quest and everything in it?')) { state.quests = state.quests.filter(x => x.id !== el.dataset.id); save(); render(); }
      break;
    case 'dup-quest': {
      e.preventDefault(); e.stopPropagation();
      const i = state.quests.findIndex(x => x.id === el.dataset.id); if (i < 0) break;
      const c = clone(state.quests[i]); c.id = uid(); c.name = (c.name || 'Untitled') + ' (Copy)';
      state.quests.splice(i + 1, 0, c); save();
      toast('Duplicated. You are now editing the copy.');
      if (r.kind === 'quest') location.hash = '#/q/' + c.id; else render();
      break;
    }
    case 'add-char': { const c = blankChar(); doc.characters.push(c); save(); renderQuestBody(doc); focusId(c.id); break; }
    case 'del-char':
      if (confirm('Delete this story character? Their dialogue lines will switch to Narrator.')) {
        doc.characters = doc.characters.filter(c => c.id !== el.dataset.m);
        doc.blocks.forEach(b => (b.lines || []).forEach(l => { if (l.speaker === el.dataset.m) l.speaker = 'narrator'; }));
        save(); renderQuestBody(doc);
      }
      break;
    case 'del-char-img': { const c = findObj(doc, el.dataset.m); if (c) { c.image = ''; save(); renderQuestBody(doc); } break; }
    case 'add-blk': { const b = blankBlock(el.dataset.type); doc.blocks.push(b); save(); renderQuestBody(doc); focusId(b.id); break; }
    case 'del-blk':
      if (confirm('Delete this section?')) { doc.blocks = doc.blocks.filter(b => b.id !== el.dataset.b); save(); renderQuestBody(doc); }
      break;
    case 'blk-up': case 'blk-down':
      if (swap(doc.blocks, el.dataset.b, act === 'blk-up' ? -1 : 1)) { save(); renderQuestBody(doc); focusId(el.dataset.b); }
      break;
    case 'add-line': {
      const b = findObj(doc, el.dataset.b); if (!b) break;
      const last = b.lines[b.lines.length - 1];
      const l = { id: uid(), speaker: last ? last.speaker : 'narrator', text: '' };
      b.lines.push(l); save(); renderQuestBody(doc); focusId(l.id); break;
    }
    case 'del-line': { const b = findObj(doc, el.dataset.b); if (b) { b.lines = b.lines.filter(l => l.id !== el.dataset.l); save(); renderQuestBody(doc); } break; }
    case 'line-up': case 'line-down': {
      const b = findObj(doc, el.dataset.b);
      if (b && swap(b.lines, el.dataset.l, act === 'line-up' ? -1 : 1)) { save(); renderQuestBody(doc); focusId(el.dataset.l); }
      break;
    }
    case 'add-choice': {
      const b = findObj(doc, el.dataset.b); if (!b) break;
      const c = { id: uid(), label: `Option ${b.choices.length + 1}`, outcome: '' };
      b.choices.push(c); save(); renderQuestBody(doc); focusId(c.id); break;
    }
    case 'del-choice': { const b = findObj(doc, el.dataset.b); if (b) { b.choices = b.choices.filter(c => c.id !== el.dataset.c); save(); renderQuestBody(doc); } break; }

    /* ----- keywording ----- */
    case 'kw-add': {
      const k = el.dataset.type === 'header' ? { id: uid(), type: 'header', text: 'New section' } : { id: uid(), type: 'entry', name: 'New keyword', text: '', images: [], links: [] };
      state.keywords.push(k); save(); renderKeywords(); focusId(k.id); break;
    }
    case 'kw-del':
      if (confirm('Delete this item?')) { state.keywords = state.keywords.filter(k => k.id !== el.dataset.b); save(); renderKeywords(); }
      break;
    case 'kw-up': case 'kw-down':
      if (swap(state.keywords, el.dataset.b, act === 'kw-up' ? -1 : 1)) { save(); renderKeywords(); focusId(el.dataset.b); }
      break;

    /* ----- site ----- */
    case 'export': exportJSON(); break;
    case 'import': $('#jsonPick').click(); break;
    case 'discard':
      if (confirm('Throw away your local edits and reload the published data.json?')) { await idb.del('draft'); location.reload(); }
      break;
    case 'lock': lock(); break;
  }
});

/* ---------- images ---------- */
let pickTarget = null;
function toData(file, max) {
  return new Promise((res, rej) => {
    if (file.type === 'image/gif' && file.size < 4 * 1024 * 1024) { // keep animation
      const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); return;
    }
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/webp', 0.85));
    };
    img.onerror = rej; img.src = url;
  });
}
const VIDEO_MAX = 4 * 1024 * 1024;   // bigger clips should live in the repo, not inside data.json
const readDataURL = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); });
async function handleFiles(target, files) {
  if (!editing) return;
  const r = route(), doc = r.doc; if (!doc) return;
  const list = [...files].filter(f => f.type.startsWith('image/') || f.type.startsWith('video/'));
  if (!list.length) { toast('Only image and video files can be added'); return; }
  for (const f of list) {
    try {
      if (f.type.startsWith('video/')) {
        const o = target === 'portrait' ? null : findObj(doc, target);
        if (!o || !Array.isArray(o.links)) { toast('Videos cannot be added here'); continue; }
        if (f.size > VIDEO_MAX) {
          toast(`“${f.name}” is too big to store in the site data (4 MB limit). Upload it to your GitHub repo, then paste its path, like videos/${f.name}, into the link box.`, 9000);
          continue;
        }
        o.links.push(await readDataURL(f)); continue;
      }
      const data = await toData(f, target === 'portrait' ? 1100 : 900);
      if (target === 'portrait') doc.portrait = data;
      else {
        const o = findObj(doc, target); if (!o) continue;
        if (Array.isArray(o.images)) o.images.push(data); else if ('image' in o) o.image = data;
      }
    } catch { toast('Could not read ' + f.name); }
  }
  save();
  target === 'portrait' ? render() : refresh();
}
$('#filePick').onchange = e => { handleFiles(pickTarget, e.target.files); e.target.value = ''; };

['dragover', 'drop'].forEach(ev => window.addEventListener(ev, e => e.preventDefault()));
document.addEventListener('dragover', e => { const d = e.target.closest('[data-drop]'); $$('.drop.over').forEach(x => x !== d && x.classList.remove('over')); d && d.classList.add('over'); });
document.addEventListener('dragleave', e => { const d = e.target.closest('[data-drop]'); d && d.classList.remove('over'); });
document.addEventListener('drop', e => {
  const d = e.target.closest('[data-drop]'); if (!d) return;
  d.classList.remove('over'); handleFiles(d.dataset.drop, e.dataTransfer.files);
});

/* ---------- export / import ---------- */
function exportJSON() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'data.json'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Saved data.json. Upload it to your repo to publish.');
}
$('#jsonPick').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!Array.isArray(d.pages)) throw 0;
    if (!confirm('Replace your current draft with this file?')) return;
    state = migrateState({ editHash: d.editHash || state.editHash || '', pages: d.pages, quests: d.quests, keywords: d.keywords });
    await saveNow(); location.hash = '#/'; render(); toast('Imported');
  } catch { toast('That file is not a valid data.json'); }
};

/* ---------- toast ---------- */
let toastTimer;
function toast(msg, ms = 3200) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}

/* ---------- boot ---------- */
(async function init() {
  let draft = null;
  try { draft = await idb.get('draft'); } catch {}
  if (draft && draft.pages) state = draft;
  else {
    try { const r = await fetch('data.json', { cache: 'no-store' }); if (r.ok) state = await r.json(); } catch {}
    if (!state || !Array.isArray(state.pages)) state = seed();
  }
  migrateState(state);
  editing = sessionStorage.getItem('codex-unlocked') === '1' && !!state.editHash;
  render();
})();
</script>
